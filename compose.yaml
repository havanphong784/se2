services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vocabloom
      POSTGRES_USER: vocabloom
      POSTGRES_PASSWORD: vocabloom
    ports:
      - "5432:5432"
    volumes:
      - vocabloom-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocabloom -d vocabloom"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vocabloom-data:
